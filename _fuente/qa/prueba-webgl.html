<!doctype html><meta charset="utf-8"><title>webgl</title>
<body style="margin:0;background:#f2efe6;font:16px monospace">
<canvas id="c" width="400" height="200"></canvas><p id="p"></p>
<script>
const gl = document.getElementById('c').getContext('webgl2') || document.getElementById('c').getContext('webgl');
const p = document.getElementById('p');
if (!gl) { p.textContent = 'SIN WEBGL'; } else {
  gl.clearColor(0.75, 0.23, 0.15, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  p.textContent = 'WEBGL OK · ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
}
</script>
